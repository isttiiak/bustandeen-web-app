<!DOCTYPE html>
<html lang="en" data-theme="bustandeen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted and bundled with the app (src/fonts.ts):
         no request to Google Fonts. -->
    <title>Bustandeen - Nourish Your Deen</title>
    <meta
      name="description"
      content="Track your zikr, salat, fasting and Quran reading - with authentic references, streaks, prayer times and a private circle of friends. Free, ad-free, and built for the Muslim community."
    />
    <meta name="keywords" content="islamic app, zikr counter, tasbih counter, salat tracker, prayer tracker, fasting tracker, quran habit, prayer times, muslim productivity" />
    <meta name="author" content="Istiak Islam" />
    <meta name="theme-color" content="#1a1812" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS "Add to Home Screen": without these, iOS falls back to a page
         screenshot for the icon and opens in a browser-like frame with a
         mismatched status bar. "black" keeps the status bar opaque so page
         content never slides under it (no safe-area handling needed). -->
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bustandeen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="canonical" href="https://bustandeen.com/" />

    <!-- Open Graph (Facebook, WhatsApp, Messenger, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bustandeen" />
    <meta property="og:title" content="Bustandeen - Nourish Your Deen" />
    <meta property="og:description" content="Zikr, salat, fasting, Quran and prayer times - with streaks, authentic references, and friends to race toward good. 'So compete with one another in doing good' (Quran 2:148)." />
    <meta property="og:url" content="https://bustandeen.com/" />
    <meta property="og:image" content="https://bustandeen.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bustandeen — your daily worship companion" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bustandeen - Nourish Your Deen" />
    <meta name="twitter:description" content="Zikr, salat, fasting, Quran and prayer times - with streaks, authentic references, and friends to race toward good." />
    <meta name="twitter:image" content="https://bustandeen.com/og-image.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Bustandeen",
      "alternateName": "Bustandeen - Nourish Your Deen",
      "url": "https://bustandeen.com/",
      "description": "Track zikr, salat, fasting and Quran reading with streaks, prayer times, authentic Quran & hadith references, and a private circle of friends.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Istiak Islam", "url": "https://github.com/isttiiak" },
      "inLanguage": "en",
      "featureList": [
        "Zikr counter with daily goals and streaks",
        "Salat tracker with analytics",
        "Prayer times calculated on-device",
        "Fiqh-aware fasting tracker",
        "Quran reading habit and khatm journey",
        "A private circle of friends"
      ]
    }
    </script>

    <!-- Before first paint: the theme (no flash), and a "has-session" class for
         signed-in visitors so the prerendered landing page in index.html
         (scripts/prerender.mjs) never flashes before their Home loads.
         Kept on ONE line: its sha256 is allow-listed in the CSP in
         /vercel.json, and scripts/check-csp.mjs fails the build if the two
         drift apart. -->
    <script>try{var d=document.documentElement;d.setAttribute("data-theme",localStorage.getItem("bustandeen_theme")||"bustandeen");if(localStorage.getItem("bustandeen_idToken"))d.classList.add("has-session")}catch(e){}</script>
    <style>.has-session [data-prerendered-landing]{display:none}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
