<div class="space-y-6">
<section class="space-y-3">
<div>
<h2 class="text-white font-bold text-sm uppercase tracking-widest text-white/70">Quarterly public report</h2>
<p class="text-white/70 text-xs mt-0.5">Received and spent are always computed fresh from verified donations and the expense ledger. Nothing here is typed in by hand. Nothing shows on the public page until you publish.</p>
</div>
<div class="grid lg:grid-cols-2 gap-6">
<div class="rounded-card border border-brand-border bg-brand-deep shadow-elev-2 p-4 space-y-2">
<p class="text-white/70 text-xs font-bold uppercase tracking-wide">Quarters</p>
</div>
<div class="rounded-card border border-brand-border bg-brand-deep shadow-elev-2 p-4 space-y-2 h-fit">
<p class="text-white/70 text-xs font-bold">Preview &amp; publish a quarter</p>
<input placeholder="2026-Q3" aria-label="2026-Q3" class="px-3 py-2 rounded-control bg-brand-surface border border-brand-border text-white text-sm placeholder:text-white/70 focus:outline-none focus:border-brand-emerald focus:ring-2 focus:ring-brand-emerald/30 transition-colors w-full" value="2026-Q4"/>
<button class="inline-flex items-center justify-center gap-1.5 rounded-control px-3 py-1.5 text-xs font-bold text-white/80 hover:text-white bg-brand-surface border border-brand-border hover:border-brand-emerald/40 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Calculate</button>
<input placeholder="Notes (e.g. server costs, qari recording)" aria-label="Notes (e.g. server costs, qari recording)" class="px-3 py-2 rounded-control bg-brand-surface border border-brand-border text-white text-sm placeholder:text-white/70 focus:outline-none focus:border-brand-emerald focus:ring-2 focus:ring-brand-emerald/30 transition-colors w-full" value=""/>
<button disabled="" class="btn-solid inline-flex items-center justify-center gap-2 rounded-control px-4 py-2.5 text-sm font-bold text-on-color bg-brand-emerald-dim hover:bg-brand-emerald-dim hover:brightness-110 shadow-elev-1 transition disabled:opacity-50 disabled:cursor-not-allowed">Publish</button>
</div>
</div>
</section>
</div>
