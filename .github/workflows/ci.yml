name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs only read the repository (audit P3-4).
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact version, not '24': the prerendered prayer-time pages take their
  # timezone rules from the data bundled with Node, and seo/nonBdSsr.test.ts
  # holds a snapshot of those pages recorded on this version. A newer Node
  # changed the Canadian pages (2026-11-16). Raise this together with the
  # snapshot, after checking which cities and dates moved.
  NODE_VERSION: '24.21.0'

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: ${{ runner.os }}-root-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Cache backend node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Cache frontend node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node_modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: i18n completeness (Bangla)
        working-directory: frontend
        run: npm run i18n:check

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Test frontend (coverage; fiqh utils must stay >= 90% lines)
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt
          {
            echo '### Frontend coverage'
            echo '```'
            sed -n '/^-*|-/,$p' test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        working-directory: frontend
        # Placeholder Firebase config: the build only needs the values to
        # exist, and the e2e smoke tests run in demo mode (no sign-in).
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: '1:000:web:000'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000'
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (demo mode, production build)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      # npm audit --omit=dev, failing on high/critical advisories except the
      # reviewed, dated exceptions in scripts/audit-gate.mjs.
      - name: Audit backend (production deps, high+)
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            node ../scripts/audit-gate.mjs && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed, retrying in 15s (attempt $((attempt + 1))/3)..."
              sleep 15
            fi
          done
          echo "npm audit failed after 3 attempts."
          exit 1

      - name: Audit frontend (production deps, high+)
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            node ../scripts/audit-gate.mjs && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed, retrying in 15s (attempt $((attempt + 1))/3)..."
              sleep 15
            fi
          done
          echo "npm audit failed after 3 attempts."
          exit 1

  storage-rules:
    name: Storage rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 21 (Firebase emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        working-directory: firebase
        run: npm ci

      - name: Test storage.rules
        working-directory: firebase
        run: npm test
