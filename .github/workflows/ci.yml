name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-root-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node_modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Test frontend (coverage; fiqh utils must stay >= 90% lines)
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt
          {
            echo '### Frontend coverage'
            echo '```'
            sed -n '/^-*|-/,$p' test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        working-directory: frontend
        # Placeholder Firebase config: the build only needs the values to
        # exist, and the e2e smoke tests run in demo mode (no sign-in).
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: '1:000:web:000'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000'
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (demo mode, production build)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Audit backend (production deps, high+)
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            npm audit --production --audit-level=high && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed, retrying in 15s (attempt $((attempt + 1))/3)..."
              sleep 15
            fi
          done
          echo "npm audit failed after 3 attempts."
          exit 1

      - name: Audit frontend (production deps, high+)
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            npm audit --production --audit-level=high && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed, retrying in 15s (attempt $((attempt + 1))/3)..."
              sleep 15
            fi
          done
          echo "npm audit failed after 3 attempts."
          exit 1
