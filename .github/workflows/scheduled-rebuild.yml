name: Manual rebuild

# The prerendered pages are dated at build time: the district timetables
# keep this month and the next two (T4.4), and the Ramadan calendars read
# Bangladesh's moon-sighting records (T4.1). Without a deploy nothing rolls
# over.
# - Monthly: a Vercel Cron (/api/cron/rebuild, vercel.json "crons") calls the
#   same deploy hook on the 1st at 00:30 UTC (06:30 in Bangladesh). It used to
#   be a schedule here, but GitHub turns off scheduled workflows on a public
#   repo after 60 days without a commit (LT-1).
# - By hand (Actions > Manual rebuild > Run workflow), e.g. right after a
#   moon-sighting record is entered in Admin.
# Needs the repository secret VERCEL_DEPLOY_HOOK_URL (Vercel > Project >
# Settings > Git > Deploy Hooks, branch main). Until it exists this is a no-op.

on:
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    name: Trigger production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set: nothing deployed."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Production deploy requested."
